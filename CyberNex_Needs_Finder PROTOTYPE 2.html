<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CyberNex Needs Finder</title>
<style>
:root{--n:#1F4788;--c:#00A4EF;--o:#F7931E;--t:#EAF1FB;--x:#2D2D2D;--bd:#c5d4ec;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 Calibri,"Segoe UI",Arial,sans-serif;color:var(--x);background:#fff}
header{background:var(--n);color:#fff;padding:14px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
header b{font-size:22px}header span{color:#9fd8f7;font-size:14px}
nav{display:flex;gap:6px;padding:12px 24px;background:var(--t);flex-wrap:wrap}
nav div{padding:6px 14px;border-radius:20px;font-size:14px;color:#52607a;border:1px solid var(--bd)}
nav .on{background:var(--n);color:#fff;border-color:var(--n);font-weight:700}nav .done{color:var(--n);border-color:var(--n)}
main{max-width:980px;margin:0 auto;padding:20px 24px 60px}
h2{color:var(--n);margin:0 0 4px;font-size:26px}h3{color:var(--n);margin:22px 0 8px;font-size:18px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
label{display:block;font-size:14px;font-weight:600}
input,select,textarea{width:100%;padding:8px;border:1px solid var(--bd);border-radius:6px;font:inherit;margin-top:3px}
input[type=range]{padding:0;accent-color:var(--n)}input[type=checkbox],input[type=radio]{width:auto;margin-right:6px}
:focus-visible{outline:3px solid var(--c);outline-offset:2px}
button{font:inherit;font-weight:700;padding:10px 20px;border-radius:6px;border:2px solid var(--n);background:#fff;color:var(--n);cursor:pointer}
button.p{background:var(--n);color:#fff}button.p:hover{background:#163968}
.bar{display:flex;justify-content:space-between;margin-top:24px}
.m{background:var(--t);border-radius:8px;padding:12px 14px}.m small{display:block;color:#52607a;font-size:13px}.m b{font-size:22px;color:var(--n)}
.m.big{background:var(--n)}.m.big small{color:#bcd3f3}.m.big b{color:#fff;font-size:28px}
.note{border-left:4px solid var(--c);background:#f3f9fe;padding:10px 14px;margin:14px 0;border-radius:0 6px 6px 0}
.ok{border-color:#2e9e5b;background:#eef9f2}.bad{border-color:var(--o);background:#fff6ea}
.row{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:14px}.row i{display:block;height:16px;border-radius:3px;min-width:2px}
.row span{width:170px;flex:none}.row em{font-style:normal;white-space:nowrap}
.donut{width:170px;height:170px;border-radius:50%;margin:auto;position:relative}
.donut:after{content:"";position:absolute;inset:34px;background:#fff;border-radius:50%}
.pl{border:1px solid var(--bd);border-radius:8px;padding:12px}.pl.sel{border:2px solid var(--n);background:var(--t)}
.sc{height:8px;background:#dbe5f5;border-radius:4px;margin:6px 0}.sc i{display:block;height:100%;background:var(--n);border-radius:4px}
.pl ul{margin:6px 0 0;padding-left:18px;font-size:13px}
.chat{border:1px solid var(--bd);border-radius:8px;padding:10px;max-height:240px;overflow:auto;background:#fafcff}
.chat p{margin:6px 0;padding:6px 10px;border-radius:8px;max-width:85%}.u{background:var(--n);color:#fff;margin-left:auto!important}.a{background:var(--t)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:center}
@media(max-width:700px){.cols{grid-template-columns:1fr}.row span{width:110px}}
</style></head><body>
<header><b>CyberNex Needs Finder</b><span>Intelligent Life Insurance Needs Finder &amp; Digital Advisory Platform</span></header>
<nav id="nav"></nav>
<main id="app"></main>
<script>
/* ===== ENGINE (same logic as engine.py) ===== */
const L=1e5,C=1e7,$=id=>document.getElementById(id);
const fmt=x=>x>=C?'Rs '+(x/C).toFixed(2)+' Cr':x>=L?'Rs '+(x/L).toFixed(2)+' L':'Rs '+Math.round(x).toLocaleString('en-IN');
const up=x=>Math.ceil(Math.max(x,0)/(5*L))*5*L;
const own=p=>p.exp/(p.dep+1);
function hlv(p){let n=Math.max(p.ret-p.age,0),k=Math.max(p.inc-own(p),0),s=0;for(let t=1;t<=n;t++)s+=k*Math.pow(1+p.grow,t-1)/Math.pow(1+p.disc,t);return s}
function calc(p,o={}){p={...p,...o};const fam=Math.max(p.exp-own(p),0);let rep=0;
 if(p.dep>0)for(let t=1;t<=p.sup;t++)rep+=fam*Math.pow(1+p.infl,t-1)/Math.pow(1+p.disc,t);
 const goals=p.goals.reduce((s,g)=>s+g.a*Math.pow(1+p.infl,g.y)/Math.pow(1+p.disc,g.y),0);
 const n={'Income replacement':rep,'Outstanding liabilities':p.liab,'Future goals':goals,'Emergency fund':p.exp/2};
 const tot=Object.values(n).reduce((a,b)=>a+b,0),res=p.ex+p.sav,gap=Math.max(tot-res,0),h=hlv(p),cap=h>0?Math.min(gap,h):gap,rec=up(cap);
 return{n,tot,res,gap,h,rec,capped:h>0&&gap>h,mult:p.inc?rec/p.inc:0}}
const rate=(a,s)=>7000*Math.exp(.07*(a-25))*(s?1.6:1);
function prem(pd,cv,term,p,ci,ad){const b=cv/C*rate(p.age,p.smk)*(1+.01*(term-20));
 let x=pd=='Term Life'?b:pd=='Whole Life'?b*5:pd=='Endowment'?.7*cv/term:cv/10;
 if(ci)x*=1.15;if(ad)x*=1.05;return x}
function mat(pd,pm,term,p){if(pd=='Term Life'||pd=='Whole Life')return 0;
 const r=pd=='Endowment'?.05:{Low:.05,Medium:.07,High:.09}[p.risk];let s=0;for(let t=1;t<=term;t++)s+=pm*Math.pow(1+r,term-t+1);return s}
const PR=['Term Life','Whole Life','Endowment','ULIP'];
function recs(p,r){const cv=Math.max(r.rec,10*L),term=Math.max(Math.min(p.ret-p.age,40),10),hz=p.ret-p.age,
 gs=r.tot?r.n['Future goals']/r.tot:0,gm=p.inc?r.gap/p.inc:0;
 return PR.map(pd=>{const pm=prem(pd,cv,term,p),ok=pm<=p.bud,w=[];
  let s={'Term Life':40,'Whole Life':15,Endowment:15,ULIP:10}[pd];
  if(pd=='Term Life'){w.push('Highest cover for the lowest premium');
   if(p.obj=='Protection only'){s+=25;w.push('Matches your goal: protection only')}
   if(gm>=5){s+=10;w.push('Large coverage gap ('+gm.toFixed(0)+'x income)')}
   if(p.obj=='Wealth creation')s-=15}
  if(pd=='Whole Life'){
   if(p.obj=='Legacy / lifelong cover'){s+=30;w.push('Matches your goal: lifelong cover')}
   if(p.age<40){s+=10;w.push('Younger age keeps lifelong premium lower')}
   if(p.risk=='Low'){s+=5;w.push('Low risk appetite suits guaranteed products')}}
  if(pd=='Endowment'){
   if(p.obj=='Protection + guaranteed savings'){s+=30;w.push('Matches your goal: cover plus guaranteed savings')}
   if(gs>.3){s+=15;w.push('Goals are '+Math.round(gs*100)+'% of your need; maturity can fund them')}
   if(p.risk=='Low'){s+=10;w.push('Low risk appetite suits guaranteed returns')}}
  if(pd=='ULIP'){
   if(p.obj=='Wealth creation'){s+=30;w.push('Matches your goal: wealth creation')}
   if(p.risk=='High'){s+=15;w.push('High risk appetite suits market-linked returns')}
   else if(p.risk=='Medium'){s+=8;w.push('Medium risk appetite can handle some market risk')}else s-=10;
   if(hz>=15){s+=10;w.push('Long horizon ('+hz+' yrs) smooths market swings')}}
  if(ok)w.push('Fits your premium budget');else{s-=15;w.push('Needs about '+fmt(pm)+' per year, above your budget')}
  return{pd,s:Math.max(0,Math.min(100,s)),w,pm}}).sort((a,b)=>b.s-a.s)}
/* ===== END ENGINE ===== */

const S={stage:1,p:null,r:null,sel:null,booking:null,chat:[]};
const STG=['Your profile','Your cover','Choose a plan','Talk to an advisor'];
const COL=['#1F4788','#00A4EF','#F7931E','#8FA9D1'];
const num=(id,l,v,mn,mx,st)=>`<label>${l}<input type="number" id="${id}" value="${v}" min="${mn}" max="${mx}" step="${st}"></label>`;
function nav(){$('nav').innerHTML=STG.map((s,i)=>`<div class="${i+1==S.stage?'on':i+1<S.stage?'done':''}">${i+1}. ${s}</div>`).join('')}
function go(n){S.stage=n;nav();[s1,s2,s3,s4][n-1]();scrollTo(0,0)}
function v(id){return +$(id).value}

/* ----- Stage 1 ----- */
function s1(){const G=[['Child education',2000000,12,1],['Child marriage',1500000,20,0],['Other goal (home, business)',1000000,10,0]];
$('app').innerHTML=`<h2>Tell us about you</h2><p>Answer a few simple questions. We do the maths.</p>
<div class="g">${num('age','Your age',30,18,65,1)}${num('ret','Planned retirement age',60,45,70,1)}${num('inc','Annual income (Rs)',1200000,0,1e8,50000)}${num('exp','Annual household expenses (Rs)',600000,0,1e8,25000)}${num('dep','People who depend on you',2,0,10,1)}${num('sup','Years your family needs income support',15,5,30,1)}</div>
<h3>Money you owe and have</h3><div class="g">${num('liab','Outstanding loans (Rs)',2500000,0,5e8,100000)}${num('ex','Existing life cover (Rs)',0,0,1e9,500000)}${num('sav','Savings your family could use (Rs)',500000,0,5e8,100000)}${num('bud','Premium you can pay per year (Rs)',30000,5000,5e6,1000)}</div>
<h3>Future goals</h3><div class="g">${G.map((g,i)=>`<div class="m"><label><input type="checkbox" id="go${i}" ${g[3]?'checked':''}>${g[0]}</label>${num('ga'+i,'Cost today (Rs)',g[1],0,5e8,100000)}${num('gy'+i,'Years from now',g[2],1,40,1)}</div>`).join('')}</div>
<h3>Your preferences</h3><div class="g"><label>Risk appetite<select id="risk"><option>Low</option><option selected>Medium</option><option>High</option></select></label>
<label>What matters most?<select id="obj"><option>Protection only</option><option>Protection + guaranteed savings</option><option>Wealth creation</option><option>Legacy / lifelong cover</option></select></label>
<label><br><input type="checkbox" id="smk">I use tobacco</label></div>
<details><summary><b>Advanced assumptions</b></summary><div class="g" style="margin-top:8px">${num('infl','Inflation (%)',6,3,10,.5)}${num('disc','Expected return on money (%)',8,5,12,.5)}${num('grow','Yearly income growth (%)',5,0,10,.5)}</div></details>
<p id="err" style="color:#b3261e"></p><div class="bar"><span></span><button class="p" onclick="calcAll()">Calculate my cover</button></div>`}
function calcAll(){const p={age:v('age'),ret:v('ret'),inc:v('inc'),exp:v('exp'),dep:v('dep'),sup:v('sup'),liab:v('liab'),ex:v('ex'),sav:v('sav'),bud:v('bud'),risk:$('risk').value,obj:$('obj').value,smk:$('smk').checked,infl:v('infl')/100,disc:v('disc')/100,grow:v('grow')/100,goals:[]};
 for(let i=0;i<3;i++)if($('go'+i).checked)p.goals.push({n:$('go'+i).parentNode.textContent.trim(),a:v('ga'+i),y:v('gy'+i)});
 if(p.ret<=p.age){$('err').textContent='Retirement age must be higher than your current age.';return}
 S.p=p;S.r=calc(p);S.sel=null;S.booking=null;go(2)}

/* ----- Stage 2 ----- */
function s2(){const r=S.r,keys=Object.keys(r.n);let a=0;
const grad=keys.map((k,i)=>{const s=a;a+=r.tot?r.n[k]/r.tot*100:0;return COL[i]+' '+s+'% '+a+'%'}).join(',');
const mx=Math.max(r.tot,1);
const bars=[...keys.map((k,i)=>[k,r.n[k],COL[i]]),['Total need',r.tot,'#2D2D2D'],['Existing resources',r.res,'#2e9e5b'],['Cover gap',r.gap,'#F7931E']]
 .map(b=>`<div class="row"><span>${b[0]}</span><i style="width:${Math.max(b[1]/mx*45,.3)}%;background:${b[2]}"></i><em>${fmt(b[1])}</em></div>`).join('');
$('app').innerHTML=`<h2>Your recommended cover</h2>
<div class="g"><div class="m big"><small>Recommended life cover</small><b>${fmt(r.rec)}</b></div><div class="m"><small>As a multiple of income</small><b>${r.mult.toFixed(1)}x</b></div><div class="m"><small>Total family need</small><b>${fmt(r.tot)}</b></div><div class="m"><small>Human Life Value</small><b>${fmt(r.h)}</b></div></div>
<div class="note"><b>How we got here.</b> Your family would need ${fmt(r.tot)} in total. You already have ${fmt(r.res)} (existing cover and savings), leaving a gap of ${fmt(r.gap)}. ${r.capped?'That gap is higher than your Human Life Value, so we cap the cover at HLV.':'This is within your Human Life Value of '+fmt(r.h)+', so the two methods agree.'} The final figure is rounded up to the next Rs 5 lakh.</div>
<div class="cols"><div><div class="donut" style="background:conic-gradient(${grad})" role="img" aria-label="Share of each need"></div>
<div style="margin-top:12px;font-size:14px">${keys.map((k,i)=>`<div><span style="display:inline-block;width:12px;height:12px;background:${COL[i]};margin-right:6px"></span>${k} (${r.tot?Math.round(r.n[k]/r.tot*100):0}%)</div>`).join('')}</div></div><div>${bars}</div></div>
<h3>What if my life changes?</h3><div class="g"><label>Income change: <b id="vi">0%</b><input type="range" id="si" min="-50" max="50" step="5" value="0"></label>
<label>Additional dependents: <b id="vd">0</b><input type="range" id="sd" min="0" max="3" value="0"></label>
<label>New loan (Rs lakh): <b id="vl">0</b><input type="range" id="sl" min="0" max="100" step="5" value="0"></label>
<label>Inflation: <b id="vf">${(S.p.infl*100).toFixed(1)}%</b><input type="range" id="sf" min="3" max="10" step=".5" value="${S.p.infl*100}"></label></div>
<div id="scn" class="note"></div>
<div class="bar"><button onclick="go(1)">Back</button><button class="p" onclick="go(3)">See matching plans</button></div>`;
['si','sd','sl','sf'].forEach(i=>$(i).oninput=scn);scn()}
function scn(){const i=v('si'),d=v('sd'),l=v('sl'),f=v('sf');$('vi').textContent=i+'%';$('vd').textContent=d;$('vl').textContent=l;$('vf').textContent=f+'%';
const p=S.p,sc=calc(p,{inc:p.inc*(1+i/100),dep:p.dep+d,liab:p.liab+l*L,infl:f/100}),df=sc.rec-S.r.rec;
$('scn').innerHTML=`Cover in this scenario: <b>${fmt(sc.rec)}</b> (today ${fmt(S.r.rec)}, change ${df>=0?'+':'-'}${fmt(Math.abs(df))})`}

/* ----- Stage 3 ----- */
function s3(){const p=S.p,r=S.r,rc=recs(p,r),mxc=Math.max(2*r.rec,2*C),dc=Math.min(Math.max(r.rec,10*L),mxc),mt=Math.max(Math.min(40,75-p.age),10),dt=Math.min(Math.max(p.ret-p.age,10),mt);
S.rc=rc;S.pd=S.pd&&S.sel?S.pd:rc[0].pd;
$('app').innerHTML=`<h2>Plans matched to you</h2><p>The match score shows how well each plan fits your gap, budget, goal and risk.</p>
<div class="g">${rc.map(x=>`<div class="pl" id="pl${x.pd.replace(' ','')}"><b>${x.pd}</b> <small>${x.s}/100</small><div class="sc"><i style="width:${x.s}%"></i></div><ul>${x.w.map(t=>`<li>${t}</li>`).join('')}</ul></div>`).join('')}</div>
<h3>Choose and tweak your plan</h3><label>Plan<select id="pd">${PR.map(x=>`<option ${x==S.pd?'selected':''}>${x}</option>`).join('')}</select></label>
<div class="g" style="margin-top:10px"><label>Life cover: <b id="vc"></b><input type="range" id="sc" min="${10*L}" max="${mxc}" step="${5*L}" value="${dc}"></label>
<label>Policy term: <b id="vt"></b> years<input type="range" id="st" min="10" max="${mt}" value="${dt}"></label>
<label><input type="checkbox" id="ci">Critical illness rider (+15%)</label><label><input type="checkbox" id="ad">Accidental death rider (+5%)</label></div>
<div id="o3"></div><div class="bar"><button onclick="go(2)">Back</button><button class="p" onclick="go(4)">Confirm plan and talk to an advisor</button></div>`;
['pd','sc','st','ci','ad'].forEach(i=>$(i).oninput=o3);o3()}
function o3(){const p=S.p,pd=$('pd').value,cv=v('sc'),t=v('st'),ci=$('ci').checked,ad=$('ad').checked,pm=prem(pd,cv,t,p,ci,ad),mv=mat(pd,pm,t,p),ok=pm<=p.bud;
$('vc').textContent=fmt(cv);$('vt').textContent=t;S.sel={pd,cv,t,pm,ci,ad};S.pd=pd;
S.rc.forEach(x=>{const e=$('pl'+x.pd.replace(' ',''));if(e)e.className='pl'+(x.pd==pd?' sel':'')});
const W=640,H=200,ys=[...Array(t)].map((_,i)=>i+1),top=Math.max(cv,mv,pm*t)*1.05,X=y=>40+(y-1)/Math.max(t-1,1)*(W-60),Y=a=>H-20-a/top*(H-40);
const ln=(f,c,d)=>`<polyline fill="none" stroke="${c}" stroke-width="2.5" ${d?'stroke-dasharray="6 4"':''} points="${ys.map(y=>X(y)+','+Y(f(y))).join(' ')}"/>`;
$('o3').innerHTML=`<div class="g" style="margin-top:12px"><div class="m"><small>Yearly premium</small><b>${fmt(pm)}</b></div><div class="m"><small>Monthly premium</small><b>${fmt(pm/12)}</b></div><div class="m"><small>Total premiums paid</small><b>${fmt(pm*t)}</b></div><div class="m"><small>Projected maturity value</small><b>${mv?fmt(mv):'Protection only'}</b></div></div>
<div class="note ${ok?'ok':'bad'}">${ok?'Within your budget of '+fmt(p.bud)+' per year.':'About '+fmt(pm-p.bud)+' per year above your budget. Try a lower cover, another plan, or fewer riders.'}</div>
<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Premiums, cover and fund value by year"><line x1="40" y1="${H-20}" x2="${W-20}" y2="${H-20}" stroke="#999"/>
${ln(y=>pm*y,'#F7931E')}${ln(()=>cv,'#1F4788',1)}${mv?ln(y=>mat(pd,pm,y,p),'#00A4EF'):''}
<text x="42" y="14" font-size="13" fill="#F7931E">Premiums paid</text><text x="150" y="14" font-size="13" fill="#1F4788">Life cover (dashed)</text>${mv?'<text x="290" y="14" font-size="13" fill="#00A4EF">Projected fund value</text>':''}
<text x="${W-20}" y="${H-4}" font-size="12" text-anchor="end" fill="#555">Policy year ${t}</text></svg>
<small>Premiums are illustrative model values, not insurer quotes.</small>`}

/* ----- Stage 4 ----- */
const ADV={'Ananya Rao':'Term and protection planning, 9 years','Rahul Mehta':'ULIPs and wealth creation, 12 years','Kavita Nair':'Retirement and legacy planning, 15 years'};
function s4(){const s=S.sel,d=new Date(Date.now()+864e5).toISOString().slice(0,10);
$('app').innerHTML=`<h2>Talk to an advisor</h2><div class="note"><b>Your plan:</b> ${s.pd}, cover ${fmt(s.cv)}, ${s.t} years, about ${fmt(s.pm)} per year</div>
<div class="cols" style="align-items:start"><div id="bk"></div><div><h3 style="margin-top:0">Ask the assistant</h3><div class="chat" id="ch"></div>
<div style="display:flex;gap:8px;margin-top:8px"><input id="q" placeholder="Ask about your cover, premium or plans"><button class="p" onclick="ask()">Send</button></div></div></div>
<div class="bar"><button onclick="go(3)">Back to plans</button><button onclick="S.stage=1;S.sel=null;go(1)">Start over</button></div>`;
$('q').onkeydown=e=>{if(e.key=='Enter')ask()};book(d);chat()}
function book(d){const b=S.booking;
$('bk').innerHTML=b?`<div class="note ok"><b>Booked. Reference ${b.ref}</b><br>${b.adv} will join you by ${b.mode.toLowerCase()} on ${b.day} at ${b.slot}.<br><small>Simulated booking saved on this device.</small></div>`:
`<h3 style="margin-top:0">Book a consultation</h3>${Object.keys(ADV).map((a,i)=>`<label style="font-weight:400"><input type="radio" name="adv" value="${a}" ${i?'':'checked'}><b>${a}</b>: ${ADV[a]}</label>`).join('')}
<div class="g" style="margin-top:8px"><label>Mode<select id="md"><option>Video call</option><option>Chat</option></select></label><label>Date<input type="date" id="dy" value="${d}" min="${d}"></label>
<label>Time slot<select id="sl2">${['10:00 AM','11:30 AM','2:00 PM','4:30 PM','6:00 PM'].map(x=>`<option>${x}</option>`).join('')}</select></label><label>Your name<input id="nm"></label><label>Mobile number<input id="ph" type="tel"></label></div>
<label style="margin-top:8px">Anything to discuss? (optional)<textarea id="nt" rows="2"></textarea></label><p id="be" style="color:#b3261e;margin:4px 0"></p><button class="p" onclick="confirmB()">Confirm booking</button>`}
function confirmB(){if(!$('nm').value.trim()||!$('ph').value.trim()){$('be').textContent='Enter your name and mobile number.';return}
const b={ref:'CNX-'+Math.random().toString(36).slice(2,8).toUpperCase(),adv:document.querySelector('[name=adv]:checked').value,mode:$('md').value,day:$('dy').value,slot:$('sl2').value};
try{const a=JSON.parse(localStorage.getItem('cnxBookings')||'[]');a.push({...b,name:$('nm').value,phone:$('ph').value,plan:S.sel.pd,cover:S.sel.cv,notes:$('nt').value});localStorage.setItem('cnxBookings',JSON.stringify(a))}catch(e){}
S.booking=b;book()}
function reply(q){q=q.toLowerCase();const r=S.r,s=S.sel,p=S.p,h=w=>w.some(x=>q.includes(x));
if(h(['why','how much','cover','amount']))return`Your recommended cover is ${fmt(r.rec)}. Your family would need ${fmt(r.tot)} (income replacement, loans, goals, emergency fund). After your existing resources of ${fmt(r.res)}, the gap is ${fmt(r.gap)}.`;
if(h(['premium','cost','price','afford']))return`For ${s.pd} with ${fmt(s.cv)} cover over ${s.t} years, the illustrative premium is ${fmt(s.pm)} per year. Your budget is ${fmt(p.bud)}.`;
if(h(['term','ulip','endowment','whole','plan','product']))return'Term gives the most cover for the lowest premium. Whole Life covers you for life. Endowment adds guaranteed savings. ULIP links your investment to the market. An advisor can compare them with you.';
if(h(['tax','80c']))return'Tax benefits depend on current rules and your policy. Please confirm the details with your advisor.';
return'I can explain your cover, premium or plan types. For anything else, please book a slot with an advisor.'}
